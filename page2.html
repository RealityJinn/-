<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загадки закончились</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #020408 0%, #050a15 20%, #0a1225 40%, #060c1a 60%, #030710 80%, #010306 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 50% 50%, rgba(80, 40, 120, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(40, 20, 80, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(60, 30, 100, 0.06) 0%, transparent 40%);
            pointer-events: none; z-index: 0;
        }

        /* Nebula swirls */
        .nebula {
            position: fixed; border-radius: 50%; filter: blur(80px);
            opacity: 0.15; pointer-events: none; z-index: 0;
            animation: nebulaFloat 20s ease-in-out infinite;
        }
        .nebula:nth-child(1) { width: 600px; height: 600px; background: radial-gradient(circle, #4a1a7a 0%, transparent 70%); top: -150px; left: -200px; animation-delay: 0s; }
        .nebula:nth-child(2) { width: 500px; height: 500px; background: radial-gradient(circle, #1a3a7a 0%, transparent 70%); bottom: -100px; right: -150px; animation-delay: -7s; }
        .nebula:nth-child(3) { width: 400px; height: 400px; background: radial-gradient(circle, #7a1a4a 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -14s; animation-duration: 25s; }
        @keyframes nebulaFloat {
            0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.12; }
            33% { transform: scale(1.15) translate(30px, -20px); opacity: 0.2; }
            66% { transform: scale(0.9) translate(-20px, 30px); opacity: 0.15; }
        }

        /* Stars */
        .star {
            position: fixed; width: 3px; height: 3px; background: #fff;
            border-radius: 50%; z-index: 1; pointer-events: none;
            animation: starTwinkle 3s ease-in-out infinite;
            box-shadow: 0 0 6px 2px rgba(255,255,255,0.3);
        }
        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Mystical particles */
        .myst-particle {
            position: fixed; border-radius: 50%;
            pointer-events: none; z-index: 1;
            animation: mystFloat linear infinite;
        }
        @keyframes mystFloat {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
        }

        /* Portal / void ring */
        .void-portal {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 30%, rgba(60, 20, 100, 0.08) 50%, transparent 70%);
            border: 1px solid rgba(120, 60, 200, 0.06);
            z-index: 0;
            animation: portalPulse 6s ease-in-out infinite;
            pointer-events: none;
        }
        .void-portal::before {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 350px; height: 350px; border-radius: 50%;
            background: radial-gradient(circle, rgba(40, 10, 80, 0.1) 0%, transparent 70%);
            border: 1px solid rgba(100, 50, 180, 0.04);
            animation: portalInner 4s ease-in-out infinite reverse;
        }
        .void-portal::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(circle, rgba(80, 20, 160, 0.15) 0%, transparent 70%);
            animation: portalInner 4s ease-in-out infinite;
        }
        @keyframes portalPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
        }
        @keyframes portalInner {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(1.12) rotate(180deg); }
        }

        .container {
            position: relative; z-index: 10; text-align: center; max-width: 1000px;
        }
        .main-text {
            color: #c8d8f8;
            font-size: clamp(2.5rem, 7vw, 6rem);
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: 3px;
            text-shadow:
                0 1px 0 rgba(60, 40, 120, 0.8),
                0 2px 0 rgba(50, 30, 100, 0.6),
                0 3px 0 rgba(40, 20, 80, 0.5),
                0 4px 30px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(120, 100, 200, 0.4);
            animation: title3D 6s ease-in-out infinite;
            margin-bottom: 3rem;
            transform-style: preserve-3d;
            will-change: transform, opacity;
        }
        .fall-line {
            display: inline-block;
            white-space: pre;
            min-width: 10em;
        }
        .fall-text {
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.5, 0, 0.8, 1), opacity 0.4s;
        }
        .fall-text.fall {
            transform: translateY(110vh) rotate(var(--rot, 720deg));
            opacity: 0;
        }
        @keyframes title3D {
            0%, 100% { transform: rotateX(0deg) rotateY(-4deg) translateZ(0); }
            50% { transform: rotateX(3deg) rotateY(4deg) translateZ(10px); }
        }
        .subtitle {
            color: #7080a0;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-style: italic;
            letter-spacing: 2px;
            margin-bottom: 4rem;
            text-shadow:
                0 1px 0 rgba(30, 20, 60, 0.8),
                0 2px 0 rgba(20, 15, 40, 0.6),
                0 3px 5px rgba(0,0,0,0.5),
                0 0 15px rgba(80, 100, 160, 0.2);
            animation: fadeInUp 1.5s ease-out 0.5s both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes textGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 0.8rem;
            padding: 1.2rem 2.8rem;
            background: linear-gradient(135deg, rgba(60, 20, 100, 0.5) 0%, rgba(40, 10, 80, 0.6) 100%);
            border: 1px solid rgba(140, 100, 220, 0.35);
            border-radius: 50px; color: #c0b0e0;
            font-family: 'Georgia', serif; font-size: 1.1rem; font-weight: 500;
            cursor: pointer; backdrop-filter: blur(20px);
            position: relative;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-appearance: none;
            appearance: none;
            box-shadow:
                0 6px 0 rgba(20, 5, 50, 0.9),
                0 12px 40px rgba(60, 20, 120, 0.4),
                0 0 30px rgba(100, 60, 180, 0.15),
                inset 0 2px 0 rgba(200, 180, 255, 0.15);
            transition: all 0.25s ease;
            animation: fadeInUp 1.5s ease-out 1s both;
            letter-spacing: 1px;
        }
        .back-btn:hover {
            background: linear-gradient(135deg, rgba(80, 30, 130, 0.6) 0%, rgba(50, 15, 100, 0.7) 100%);
            border-color: rgba(180, 140, 255, 0.6);
            transform: translateY(-3px);
            box-shadow:
                0 9px 0 rgba(20, 5, 50, 0.9),
                0 18px 50px rgba(80, 30, 150, 0.5),
                0 0 50px rgba(120, 70, 200, 0.3),
                inset 0 2px 0 rgba(220, 200, 255, 0.25);
            color: #e0d0ff;
        }
        .back-btn:active {
            transform: translateY(4px);
            box-shadow:
                0 2px 0 rgba(20, 5, 50, 0.9),
                0 4px 20px rgba(40, 10, 80, 0.4),
                inset 0 1px 0 rgba(0, 0, 0, 0.2);
        }

        /* Ice crystals (now dark mystical shards) */
        .myst-crystal {
            position: absolute; pointer-events: none; z-index: 5;
            opacity: 0.2;
            animation: crystalFloat 18s ease-in-out infinite;
        }
        .myst-crystal svg { width: 100%; height: 100%; }
        @keyframes crystalFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.15; }
            25% { transform: translateY(-40px) rotate(90deg) scale(1.1); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg) scale(0.9); opacity: 0.2; }
            75% { transform: translateY(-50px) rotate(270deg) scale(1.15); opacity: 0.25; }
        }

        @media (max-width: 600px) {
            .main-text { letter-spacing: 1px; font-size: clamp(1.5rem, 4.2vw, 3.6rem); text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8), 0 0 30px rgba(120, 100, 200, 0.3); animation: title3D 5s ease-in-out infinite, textGlow 4s ease-in-out infinite; }
            .subtitle { font-size: clamp(0.6rem, 1.5vw, 0.9rem); }
            .back-btn { padding: 0.7rem 1.7rem; font-size: 0.7rem; }
            .void-portal { width: 180px; height: 180px; }
            .void-portal::before { width: 120px; height: 120px; }
            .void-portal::after { width: 70px; height: 70px; }
            .nebula, .void-portal, .myst-crystal { animation: none !important; opacity: 0.08; }
            .myst-particle { display: none; }
            .star { font-size: 1.8px !important; }
            .star { animation-duration: 2.5s !important; }
        }
    </style>
</head>
<body>
    <div class="nebula"></div>
    <div class="nebula"></div>
    <div class="nebula"></div>
    <div class="void-portal"></div>

    <div class="container">
        <h1 class="main-text"><span class="fall-line" id="fallLine"><span class="fall-text">А на сегодня</span></span> загадок больше нет</h1>
        <p class="subtitle">Завтра будет больше тайн...</p>
        <button class="back-btn" onclick="location.href='index.html'">← Вернуться к Елене</button>
    </div>
    <div id="crystals"></div>

    <script>
        const isMobile = window.innerWidth < 600;
        const starCount = isMobile ? 30 : 80;
        const mystCount = isMobile ? 0 : 20;
        const crystalCount = isMobile ? 0 : 10;
        const stars = ['✦', '✧', '⋆', '·'];
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.textContent = stars[Math.floor(Math.random() * stars.length)];
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.fontSize = (3 + Math.random() * 5) + 'px';
            star.style.animationDuration = (2 + Math.random() * 4) + 's';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.color = `rgba(${150 + Math.random() * 105}, ${150 + Math.random() * 105}, 255, ${0.3 + Math.random() * 0.7})`;
            document.body.appendChild(star);
        }

        const mystSymbols = ['✦', '✧', '⋆', '❖', '◈', '◇'];
        for (let i = 0; i < mystCount; i++) {
            const p = document.createElement('div');
            p.className = 'myst-particle';
            p.textContent = mystSymbols[Math.floor(Math.random() * mystSymbols.length)];
            p.style.left = Math.random() * 100 + '%';
            p.style.fontSize = (10 + Math.random() * 20) + 'px';
            p.style.color = `rgba(${100 + Math.random() * 100}, ${80 + Math.random() * 80}, 200, ${0.2 + Math.random() * 0.4})`;
            p.style.animationDuration = (15 + Math.random() * 25) + 's';
            p.style.animationDelay = Math.random() * 25 + 's';
            document.body.appendChild(p);
        }

        const crystalsContainer = document.getElementById('crystals');
        for (let i = 0; i < crystalCount; i++) {
            const crystal = document.createElement('div');
            crystal.className = 'myst-crystal';
            crystal.style.left = Math.random() * 100 + '%';
            crystal.style.top = Math.random() * 100 + '%';
            crystal.style.width = (20 + Math.random() * 40) + 'px';
            crystal.style.height = (30 + Math.random() * 60) + 'px';
            crystal.style.animationDuration = (12 + Math.random() * 15) + 's';
            crystal.style.animationDelay = Math.random() * 12 + 's';
            crystal.innerHTML = `<svg viewBox="0 0 20 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="10,0 20,40 10,32 0,40" fill="rgba(120,80,200,${0.1 + Math.random() * 0.15})" stroke="rgba(160,120,240,${0.15 + Math.random() * 0.15})" stroke-width="0.5"/>
            </svg>`;
            crystalsContainer.appendChild(crystal);
        }

        const fallText = document.querySelector('.fall-text');
        if (fallText) {
            const text = fallText.textContent;
            fallText.textContent = '';
            const chars = [];
            for (let i = 0; i < text.length; i++) {
                const span = document.createElement('span');
                span.className = 'fall-char';
                span.style.display = 'inline-block';
                span.style.transition = 'transform 0.4s cubic-bezier(0.5, 0, 0.8, 1), opacity 0.4s';
                span.textContent = text[i];
                fallText.appendChild(span);
                chars.push(span);
            }

            setTimeout(() => {
                chars.forEach(char => {
                    const delay = Math.random() * 0.92;
                    const rot = (Math.random() - 0.5) * 1440;
                    char.style.transitionDelay = delay + 's';
                    char.style.transitionDuration = (0.345 + Math.random() * 0.46) + 's';
                    char.style.setProperty('--rot', rot + 'deg');
                    char.style.transform = `translateY(110vh) rotate(${rot}deg)`;
                    char.style.opacity = '0';
                });
            }, 2000);
        }
    </script>
</body>
</html>
