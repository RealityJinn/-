<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>В гостьях у Елены Прекрасной</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Georgia', 'Times New Roman', serif;
        background: linear-gradient(135deg, #fef5ec 0%, #fdf2cc 25%, #f9e2b8 50%, #f6d3a4 75%, #eac088 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        position: relative;
        overflow: hidden;
    }
    html { overflow-x: hidden; }
    body::before {
        content: '';
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background-image:
            radial-gradient(circle at 20% 20%, rgba(255, 215, 180, 0.3) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(255, 180, 120, 0.2) 0%, transparent 50%),
            radial-gradient(circle at 40% 60%, rgba(255, 200, 150, 0.15) 0%, transparent 40%);
        pointer-events: none; z-index: 0;
    }
    .container {
        position: relative; z-index: 2; text-align: center; max-width: 800px; width: 100%;
    }
    .title-wrap {
        position: relative;
        display: inline-block;
        margin-bottom: 2.5rem;
        perspective: 1500px;
    }
    .title {
        font-size: clamp(2.8rem, 7vw, 5.5rem);
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -1px;
        transform-style: preserve-3d;
        -webkit-text-stroke: 3px #6b3a14;
        background: linear-gradient(180deg,
            #fff5e6 0%,
            #ffe4b8 18%,
            #ffc882 35%,
            #ffab5a 55%,
            #f08a3a 78%,
            #d06a28 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter:
            drop-shadow(0 2px 0 #b06030)
            drop-shadow(0 4px 0 #9c501e)
            drop-shadow(0 6px 0 #88420f)
            drop-shadow(0 8px 0 #743408)
            drop-shadow(0 10px 0 #602804)
            drop-shadow(0 12px 12px rgba(80, 30, 0, 0.45))
            drop-shadow(0 18px 25px rgba(80, 30, 0, 0.25));
        animation: title3D 6.25s ease-in-out infinite;
        position: relative;
        z-index: 1;
    }
    .title-white {
        position: absolute;
        left: 0;
        right: 0;
        top: -0.25em;
        font-size: clamp(2.8rem, 7vw, 5.5rem);
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -1px;
        color: #ffffff;
        text-shadow:
            0 2px 0 #b0a098,
            0 4px 0 #989088,
            0 6px 0 #807870,
            0 8px 0 #686058,
            0 10px 0 #504840,
            0 12px 12px rgba(60, 50, 40, 0.4),
            0 18px 25px rgba(60, 50, 40, 0.2);
        -webkit-text-stroke: 2px #2a1a08;
        z-index: 2;
        pointer-events: none;
        transform: translateZ(40px);
    }
    @keyframes title3D {
        0%, 100% {
            transform: rotateX(0deg) rotateY(-8deg) translateZ(0) scaleX(1) scaleY(1);
            filter:
                drop-shadow(0 2px 0 #b06030)
                drop-shadow(0 4px 0 #9c501e)
                drop-shadow(0 6px 0 #88420f)
                drop-shadow(0 8px 0 #743408)
                drop-shadow(0 10px 0 #602804)
                drop-shadow(0 12px 12px rgba(80, 30, 0, 0.45))
                drop-shadow(0 18px 25px rgba(80, 30, 0, 0.25));
        }
        50% {
            transform: rotateX(0deg) rotateY(8deg) translateZ(30px) scaleX(1.03) scaleY(1.06);
            filter:
                drop-shadow(0 2px 0 #b06030)
                drop-shadow(0 4px 0 #9c501e)
                drop-shadow(0 6px 0 #88420f)
                drop-shadow(0 8px 0 #743408)
                drop-shadow(0 10px 0 #602804)
                drop-shadow(0 15px 18px rgba(80, 30, 0, 0.55))
                drop-shadow(0 25px 35px rgba(80, 30, 0, 0.35));
        }
    }
    .ornament {
        display: flex; align-items: center; justify-content: center; gap: 2rem;
        margin-bottom: 3rem;
    }
    .ornament::before, .ornament::after {
        content: ''; flex: 1; max-width: 150px; height: 2px;
        background: linear-gradient(90deg, transparent, #d4a574, #c99668, transparent);
    }
    .ornament-center { display: flex; align-items: center; gap: 1rem; }
    .ornament-center span {
        font-size: 2.5rem; color: #c48f5e;
        animation: floatOrnament 3s ease-in-out infinite;
    }
    .ornament-center span:nth-child(2) { animation-delay: 0.3s; transform: scale(1.2); }
    .ornament-center span:nth-child(3) { animation-delay: 0.6s; }
    @keyframes floatOrnament {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(8deg); }
    }
    .balloon-wrapper {
        position: relative; display: flex; justify-content: flex-end; padding-right: 5%;
        perspective: 7500px; height: 350px; margin-top: 1rem;
    }
.balloon {
        position: relative;
        width: clamp(160px, 30vw, 240px);
        height: clamp(200px, 38vw, 300px);
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        background: linear-gradient(180deg, #ff6b9d 0%, #e85a8a 40%, #d44a7a 70%, #c03a6a 100%);
        cursor: pointer;
        box-shadow:
            inset 0 -30px 60px rgba(192, 58, 106, 0.4),
            inset 0 30px 60px rgba(255, 150, 180, 0.3),
            0 30px 80px rgba(224, 90, 138, 0.5),
            0 15px 40px rgba(139, 90, 43, 0.2);
        transition: all 0.3s ease;
        display: flex; align-items: center; justify-content: center;
        padding: 2rem 1rem; text-align: center;
        transform-style: preserve-3d;
        animation: balloonFloat 6.25s ease-in-out infinite;
        z-index: 10;
        backface-visibility: hidden;
        transform: translate3d(0, 0, 0);
    }
    .balloon::before {
        content: ''; position: absolute; top: 12%; left: 15%; width: 35%; height: 40%;
        border-radius: 50%; background: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.5) 0%, transparent 70%);
        pointer-events: none;
    }
    .balloon::after {
        content: ''; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
        width: 30px; height: 40px; background: linear-gradient(180deg, #c03a6a 0%, #a02a5a 100%);
        border-radius: 0 0 15px 15px; clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    .balloon-string {
        position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
        width: 2px; height: 80px; background: linear-gradient(180deg, transparent 0%, #8b5a2b 100%);
        border-radius: 1px; z-index: -1;
    }
    .balloon-knot {
        position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%);
        width: 18px; height: 18px; border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #e85a8a 0%, #c03a6a 70%, #a02a5a 100%);
        box-shadow: 0 2px 8px rgba(192, 58, 106, 0.5);
    }
    .balloon-text {
        color: #fff; font-size: clamp(0.85rem, 1.8vw, 1.1rem); font-weight: 600;
        font-family: 'Georgia', serif; line-height: 1.3;
        max-width: 80%;
        transform: translateZ(100px);
        text-shadow:
            0 1px 0 rgba(0,0,0,0.4),
            0 2px 0 rgba(0,0,0,0.3),
            0 3px 0 rgba(0,0,0,0.2),
            0 4px 5px rgba(0,0,0,0.4),
            0 0 10px rgba(255,255,255,0.2);
    }
    .ornament-center span {
        font-size: 2.5rem; color: #c48f5e;
        animation: floatOrnament 3s ease-in-out infinite;
        text-shadow:
            0 1px 0 #d4a060,
            0 2px 0 #c49050,
            0 3px 0 #b48040,
            0 4px 5px rgba(139,90,43,0.4),
            0 0 8px rgba(196,144,94,0.3);
    }
    @keyframes balloonFloat {
        0%, 100% { transform: translateY(0) rotate(-2deg) rotateX(0deg) rotateY(0deg); }
        20% { transform: translateY(-25px) rotate(3deg) rotateX(20deg) rotateY(-15deg); }
        40% { transform: translateY(-12px) rotate(-5deg) rotateX(-10deg) rotateY(20deg); }
        60% { transform: translateY(-30px) rotate(2deg) rotateX(15deg) rotateY(10deg); }
        80% { transform: translateY(-8px) rotate(4deg) rotateX(-15deg) rotateY(-10deg); }
    }
    .balloon:hover { animation-play-state: paused; transform: scale(1.15) translateY(-30px) rotate(5deg) rotateX(25deg) rotateY(-25deg); }
    .balloon.popping { animation: balloonPop 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; pointer-events: none; transform-origin: center center; will-change: transform, opacity; }
    @keyframes balloonPop {
        0% { transform: scale(1); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; opacity: 1; }
        30% { transform: scale(1.8); border-radius: 50%; opacity: 1; }
        60% { transform: scale(2.5); border-radius: 50%; opacity: 0.5; }
        85% { transform: scale(3.2); border-radius: 50%; opacity: 0.2; }
        100% { transform: scale(3.5); border-radius: 50%; opacity: 0; filter: none; }
    }
    .particle {
        position: absolute; width: 12px; height: 12px; border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ff6b9d 0%, #c03a6a 100%);
        pointer-events: none; animation: particleBurst 0.8s ease-out forwards;
        display: none;
    }
    .particle.active { display: block; }
    @keyframes particleBurst {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* ===== SOAP BUBBLE EMOJIS ===== */
    .bubble-wrapper {
        position: fixed;
        z-index: 1;
        pointer-events: none;
    }

    .soap-bubble {
        position: absolute;
        bottom: -100px;
        font-size: 6rem;
        animation-timing-function: ease-in-out;
        line-height: 1;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: bubbleRise linear infinite;
        will-change: transform, opacity;
        background: radial-gradient(
            circle at 30% 30%,
            rgba(255, 255, 255, 0.4) 0%,
            rgba(255, 220, 180, 0.15) 20%,
            rgba(200, 180, 255, 0.08) 40%,
            rgba(255, 200, 220, 0.1) 60%,
            rgba(180, 220, 255, 0.05) 80%,
            transparent 100%
        );
        box-shadow:
            inset 0 0 30px rgba(255, 255, 255, 0.3),
            inset -5px -5px 20px rgba(200, 180, 220, 0.15),
            0 0 20px rgba(255, 220, 200, 0.2),
            0 0 40px rgba(255, 200, 220, 0.1);
        overflow: hidden;
        max-width: 100vw;
    }

    .soap-bubble::before {
        content: '';
        position: absolute;
        top: 12%;
        left: 18%;
        width: 28%;
        height: 28%;
        background: radial-gradient(
            circle,
            rgba(255, 255, 255, 0.9) 0%,
            rgba(255, 255, 255, 0.4) 50%,
            transparent 70%
        );
        border-radius: 50%;
    }

    .soap-bubble::after {
        content: '';
        position: absolute;
        bottom: 20%;
        right: 15%;
        width: 15%;
        height: 15%;
        background: radial-gradient(
            circle,
            rgba(255, 255, 255, 0.5) 0%,
            transparent 70%
        );
        border-radius: 50%;
    }

    @keyframes bubbleRise {
        0% {
            transform: translateY(0) translateX(0) scale(0.6);
            opacity: 0;
        }
        8% {
            opacity: 0.85;
        }
        20% {
            transform: translateY(-30vh) translateX(35px) scale(1);
        }
        40% {
            transform: translateY(-70vh) translateX(-35px) scale(1.05);
        }
        60% {
            transform: translateY(-110vh) translateX(35px) scale(1.08);
        }
        80% {
            transform: translateY(-150vh) translateX(-25px) scale(1.05);
        }
        92% {
            opacity: 0.85;
        }
        100% {
            transform: translateY(-180vh) translateX(0) scale(0.7);
            opacity: 0;
        }
    }

    @media (max-width: 768px) {
        .balloon-wrapper { justify-content: center; padding-right: 0; height: 300px; }
        .title { font-size: clamp(3rem, 9vw, 5rem); }
        .soap-bubble { font-size: 3rem !important; }
    }
</style>

                <div class="balloon-string"></div>
                <div class="balloon-knot"></div>
            </div>
        </div>
    </div>

    <script>
        const balloon = document.getElementById('balloon');
        balloon.addEventListener('click', (e) => {
            balloon.classList.add('popping');
            createParticles(e.clientX, e.clientY);
            setTimeout(() => {
                window.location.href = 'page2.html';
            }, 600);
        });

        function createParticles(x, y) {
            const colors = ['#ff6b9d', '#e85a8a', '#d44a7a', '#c03a6a', '#ff99b8', '#ffb3cc'];
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle active';
                const angle = (Math.PI * 2 * i) / 30 + Math.random() * 0.5;
                const velocity = 100 + Math.random() * 200;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity - 100;
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.background = `radial-gradient(circle at 30% 30%, ${colors[Math.floor(Math.random() * colors.length)]} 0%, #c03a6a 100%)`;
                particle.style.width = `${8 + Math.random() * 12}px`;
                particle.style.height = particle.style.width;
                particle.style.animationDelay = `${Math.random() * 0.1}s`;
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 900);
            }
        }
    </script>
</body>
</html>
